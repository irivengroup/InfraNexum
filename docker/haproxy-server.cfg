global
  log stdout format raw local0
  maxconn 1024

defaults
  log global
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout check 5s

frontend infranexum-http
  bind :8080
  default_backend infranexum-server-cluster

backend infranexum-server-cluster
  balance roundrobin
  option httpchk GET /actuator/health/readiness
  http-check expect status 200
  default-server inter 3s fall 3 rise 2
  server server-1 server-1:8080 check
  server server-2 server-2:8080 check
  server server-3 server-3:8080 check
  server server-4 server-4:8080 check
