global
  log stdout format raw local0
  maxconn 512

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout check 5s

frontend postgres-write
  bind :5432
  default_backend patroni-primary

backend patroni-primary
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
  server postgres-1 postgres-1:5432 check port 8008
  server postgres-2 postgres-2:5432 check port 8008
  server postgres-3 postgres-3:5432 check port 8008

frontend postgres-read
  bind :5433
  default_backend patroni-replicas

backend patroni-replicas
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  default-server inter 2s fall 3 rise 2
  server postgres-1 postgres-1:5432 check port 8008
  server postgres-2 postgres-2:5432 check port 8008
  server postgres-3 postgres-3:5432 check port 8008
