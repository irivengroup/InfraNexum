global
  log stdout format raw local0
  maxconn 1024

defaults
  log global
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout check 5s

frontend infranexum-web-http
  bind :8080
  default_backend infranexum-web-cluster

backend infranexum-web-cluster
  balance roundrobin
  option httpchk GET /health/ready
  http-check expect status 200
  default-server inter 3s fall 3 rise 2
  server web-1 web-1:8080 check
  server web-2 web-2:8080 check
