schema: infranexum.migration-verification/v1
checks:
- id: iam-rsot-schema-permissions-exact
  postgresql: "SELECT COUNT(*) = 6 FROM infranexum_iam.permission WHERE organization_id IS NULL AND code IN ('rsot.schema.create','rsot.schema.read','rsot.schema.update','rsot.schema.deprecate','rsot.schema.publish','rsot.audit') AND system_defined=TRUE AND active=TRUE"
  oracle: "SELECT CASE WHEN COUNT(*)=6 THEN 1 ELSE 0 END FROM INFRANEXUM_IAM_PERMISSION WHERE ORGANIZATION_ID IS NULL AND CODE IN ('rsot.schema.create','rsot.schema.read','rsot.schema.update','rsot.schema.deprecate','rsot.schema.publish','rsot.audit') AND SYSTEM_DEFINED=1 AND ACTIVE=1"
- id: iam-platform-admin-has-rsot-schema-permissions
  postgresql: "SELECT COUNT(*) = 6 FROM infranexum_iam.role_permission rp JOIN infranexum_iam.permission p ON p.id=rp.permission_id WHERE rp.role_id='019ffbda-1001-7e80-9ec8-7580467e9a85' AND p.code IN ('rsot.schema.create','rsot.schema.read','rsot.schema.update','rsot.schema.deprecate','rsot.schema.publish','rsot.audit')"
  oracle: "SELECT CASE WHEN COUNT(*)=6 THEN 1 ELSE 0 END FROM INFRANEXUM_IAM_ROLE_PERMISSION rp JOIN INFRANEXUM_IAM_PERMISSION p ON p.ID=rp.PERMISSION_ID WHERE rp.ROLE_ID='019ffbda-1001-7e80-9ec8-7580467e9a85' AND p.CODE IN ('rsot.schema.create','rsot.schema.read','rsot.schema.update','rsot.schema.deprecate','rsot.schema.publish','rsot.audit')"
