  oracle: "SELECT COUNT(*) FROM INFRANEXUM_IAM_ROLE_PERMISSION rp JOIN INFRANEXUM_IAM_PERMISSION p ON p.ID=rp.PERMISSION_ID WHERE rp.ROLE_ID='019ffbda-1001-7e80-9ec8-7580467e9a85' AND p.CODE LIKE 'integrations.sync.%'"
  expected: 3
