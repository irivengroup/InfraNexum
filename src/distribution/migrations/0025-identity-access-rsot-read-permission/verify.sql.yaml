schema: infranexum.migration-verification/v1
checks:
- id: rsot-read-permission-present
  postgresql: SELECT COUNT(*) = 1 FROM infranexum_iam.permission WHERE organization_id
    IS NULL AND code='rsot.read' AND scope_kind='ORGANIZATION'
  oracle: SELECT CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END FROM INFRANEXUM_IAM_PERMISSION
    WHERE ORGANIZATION_ID IS NULL AND CODE='rsot.read' AND SCOPE_KIND='ORGANIZATION'
- id: rsot-read-platform-admin-grant-present
  postgresql: SELECT COUNT(*) = 1 FROM infranexum_iam.role_permission rp JOIN infranexum_iam.permission
    p ON p.id=rp.permission_id WHERE rp.role_id='019ffbda-1001-7e80-9ec8-7580467e9a85'
    AND p.code='rsot.read'
  oracle: SELECT CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END FROM INFRANEXUM_IAM_ROLE_PERMISSION
    rp JOIN INFRANEXUM_IAM_PERMISSION p ON p.ID=rp.PERMISSION_ID WHERE rp.ROLE_ID='019ffbda-1001-7e80-9ec8-7580467e9a85'
    AND p.CODE='rsot.read'
