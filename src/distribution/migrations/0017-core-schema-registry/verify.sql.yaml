schema: infranexum.migration-verification/v1
checks:
- id: core-schema-registry-lifecycle-columns-present
  postgresql: "SELECT COUNT(*) = 8 FROM information_schema.columns WHERE table_schema='infranexum_core' AND table_name='schema_registry_entry' AND column_name IN ('schema_version','status','checksum_sha256','revision','published_at','deprecated_at','sunset_at','compatibility_evidence')"
  oracle: "SELECT CASE WHEN COUNT(*)=8 THEN 1 ELSE 0 END FROM USER_TAB_COLUMNS WHERE TABLE_NAME='INFRANEXUM_CORE_SCHEMA_REGISTRY' AND COLUMN_NAME IN ('SCHEMA_VERSION','STATUS','CHECKSUM_SHA256','REVISION','PUBLISHED_AT','DEPRECATED_AT','SUNSET_AT','COMPATIBILITY_EVIDENCE')"
- id: core-schema-profile-member-integrity-present
  postgresql: "SELECT COUNT(*) >= 2 FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='infranexum_core' AND t.relname='schema_profile_member' AND c.contype IN ('f','u')"
  oracle: "SELECT CASE WHEN COUNT(*)>=2 THEN 1 ELSE 0 END FROM USER_CONSTRAINTS WHERE TABLE_NAME='INFRANEXUM_CORE_SCHEMA_PROFILE_MEMBER' AND CONSTRAINT_TYPE IN ('R','U')"
- id: core-schema-registry-has-no-external-foreign-key
  postgresql: "SELECT COUNT(*) = 0 FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace JOIN pg_class rt ON rt.oid=c.confrelid JOIN pg_namespace rn ON rn.oid=rt.relnamespace WHERE c.contype='f' AND n.nspname='infranexum_core' AND t.relname IN ('schema_registry_entry','schema_profile','schema_profile_member') AND rn.nspname<>'infranexum_core'"
  oracle: "SELECT CASE WHEN COUNT(*)=0 THEN 1 ELSE 0 END FROM USER_CONSTRAINTS c JOIN USER_CONSTRAINTS r ON c.R_CONSTRAINT_NAME=r.CONSTRAINT_NAME WHERE c.CONSTRAINT_TYPE='R' AND c.TABLE_NAME IN ('INFRANEXUM_CORE_SCHEMA_REGISTRY','INFRANEXUM_CORE_SCHEMA_PROFILE','INFRANEXUM_CORE_SCHEMA_PROFILE_MEMBER') AND r.TABLE_NAME NOT LIKE 'INFRANEXUM_CORE_SCHEMA_%'"
