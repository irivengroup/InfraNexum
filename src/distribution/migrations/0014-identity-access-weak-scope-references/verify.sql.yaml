schema: infranexum.migration-verification/v1
checks:
- id: iam-organization-foreign-keys-absent
  postgresql: "SELECT COUNT(*) = 0 FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace JOIN pg_class rt ON rt.oid=c.confrelid JOIN pg_namespace rn ON rn.oid=rt.relnamespace WHERE c.contype='f' AND n.nspname='infranexum_iam' AND rn.nspname='infranexum_org'"
  oracle: "SELECT CASE WHEN COUNT(*) = 0 THEN 1 ELSE 0 END FROM USER_CONSTRAINTS WHERE CONSTRAINT_NAME IN ('FK_INX_IAM_MEM_ORG','FK_INX_IAM_MEM_SUB','FK_INX_IAM_GROUP_ORG','FK_INX_IAM_PERM_ORG','FK_INX_IAM_ROLE_ORG','FK_INX_IAM_RA_ORG','FK_INX_IAM_RA_SUB') AND CONSTRAINT_TYPE='R'"
- id: iam-weak-reference-columns-preserved
  postgresql: "SELECT COUNT(*) = 7 FROM information_schema.columns WHERE table_schema='infranexum_iam' AND ((table_name='user_membership' AND column_name IN ('organization_id','subdivision_id')) OR (table_name='iam_group' AND column_name='organization_id') OR (table_name='permission' AND column_name='organization_id') OR (table_name='role' AND column_name='organization_id') OR (table_name='role_assignment' AND column_name IN ('organization_id','subdivision_id')))"
  oracle: "SELECT CASE WHEN COUNT(*) = 7 THEN 1 ELSE 0 END FROM USER_TAB_COLUMNS WHERE (TABLE_NAME='INFRANEXUM_IAM_USER_MEMBERSHIP' AND COLUMN_NAME IN ('ORGANIZATION_ID','SUBDIVISION_ID')) OR (TABLE_NAME='INFRANEXUM_IAM_GROUP' AND COLUMN_NAME='ORGANIZATION_ID') OR (TABLE_NAME='INFRANEXUM_IAM_PERMISSION' AND COLUMN_NAME='ORGANIZATION_ID') OR (TABLE_NAME='INFRANEXUM_IAM_ROLE' AND COLUMN_NAME='ORGANIZATION_ID') OR (TABLE_NAME='INFRANEXUM_IAM_ROLE_ASSIGNMENT' AND COLUMN_NAME IN ('ORGANIZATION_ID','SUBDIVISION_ID'))"
