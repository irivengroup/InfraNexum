schema: infranexum.verify/v1
checks:
- id: connector-inbox
  postgresql: "SELECT COUNT(*)=1 FROM information_schema.tables WHERE table_schema='infranexum_integrations' AND table_name='connector_inbox'"
  oracle: "SELECT COUNT(*)=1 FROM user_tables WHERE table_name='INFRANEXUM_INTEGRATION_INBOX'"
- id: connector-runtime-state
  postgresql: "SELECT COUNT(*)=1 FROM information_schema.tables WHERE table_schema='infranexum_integrations' AND table_name='connector_runtime_state'"
  oracle: "SELECT COUNT(*)=1 FROM user_tables WHERE table_name='INFRANEXUM_INTEGRATION_STATE'"
