        levelNumber:
          type: integer
        areaM2:
          type: number
          exclusiveMinimum: 0
        levelHeightM:
          type: number
          exclusiveMinimum: 0
        capacityKw:
          type: number
          exclusiveMinimum: 0
        description:
          type: string
          minLength: 1
          maxLength: 4096
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    UpdateFloorFacility:
      type: object
      additionalProperties: false
      required:
      - displayName
      - levelNumber
      - reason
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 128
        levelNumber:
          type: integer
        areaM2:
          type: number
          exclusiveMinimum: 0
        levelHeightM:
          type: number
          exclusiveMinimum: 0
        capacityKw:
          type: number
          exclusiveMinimum: 0
        description:
          type: string
          minLength: 1
          maxLength: 4096
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    CreateRoomFacility:
      type: object
      additionalProperties: false
      required:
      - organizationId
      - subdivisionId
      - parentId
      - code
      - displayName
      - areaM2
      - reason
      properties:
        organizationId:
          $ref: '#/components/schemas/UuidV7'
        subdivisionId:
          $ref: '#/components/schemas/UuidV7'
        parentId:
          $ref: '#/components/schemas/UuidV7'
        code:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$
        displayName:
          type: string
          minLength: 3
          maxLength: 128
        areaM2:
          type: number
          exclusiveMinimum: 0
        capacityKw:
          type: number
          exclusiveMinimum: 0
        accessRestriction:
          type: string
          enum:
          - open
          - restricted
          - secure
        description:
          type: string
          minLength: 1
          maxLength: 4096
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    UpdateRoomFacility:
      type: object
      additionalProperties: false
      required:
      - displayName
      - areaM2
      - reason
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 128
        areaM2:
          type: number
          exclusiveMinimum: 0
        capacityKw:
          type: number
          exclusiveMinimum: 0
        accessRestriction:
          type: string
          enum:
          - open
          - restricted
          - secure
        description:
          type: string
          minLength: 1
          maxLength: 4096
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    CreateZoneFacility:
      type: object
      additionalProperties: false
      required:
      - organizationId
      - subdivisionId
      - parentId
      - code
      - displayName
      - zoneType
      - reason
      properties:
        organizationId:
          $ref: '#/components/schemas/UuidV7'
        subdivisionId:
          $ref: '#/components/schemas/UuidV7'
        parentId:
          $ref: '#/components/schemas/UuidV7'
        code:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$
        displayName:
          type: string
          minLength: 3
          maxLength: 128
        zoneType:
          type: string
          enum:
          - cooling
          - power_distribution
          - airflow
          - security
        description:
          type: string
          minLength: 1
          maxLength: 4096
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    UpdateZoneFacility:
      type: object
      additionalProperties: false
      required:
      - displayName
      - zoneType
      - reason
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 128
        zoneType:
          type: string
          enum:
          - cooling
          - power_distribution
          - airflow
          - security
        description:
          type: string
          minLength: 1
          maxLength: 4096
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    FacilityStatusChange:
      type: object
      additionalProperties: false
      required:
      - targetStatus
      - reason
      properties:
        targetStatus:
          $ref: '#/components/schemas/FacilityStatus'
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    Facility:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - organizationId
      - subdivisionId
      - scopeId
      - code
      - displayName
      - status
      - version
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - lastReason
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        kind:
          type: string
          enum:
          - site
          - building
          - floor
          - room
          - zone
        organizationId:
          $ref: '#/components/schemas/UuidV7'
        subdivisionId:
          $ref: '#/components/schemas/UuidV7'
        parentId:
          $ref: '#/components/schemas/UuidV7'
        scopeId:
          $ref: '#/components/schemas/UuidV7'
        code:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/FacilityStatus'
        addressLine1:
          type:
          - string
          - 'null'
        addressLine2:
          type:
          - string
          - 'null'
        postalCode:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        countryCode:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        latitude:
          type:
          - number
          - 'null'
        longitude:
          type:
          - number
          - 'null'
        floorCount:
          type:
          - integer
          - 'null'
        levelNumber:
          type:
          - integer
          - 'null'
        areaM2:
          type:
          - number
          - 'null'
        levelHeightM:
          type:
          - number
          - 'null'
        capacityKw:
          type:
          - number
          - 'null'
        accessRestriction:
          type:
          - string
          - 'null'
        zoneType:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/UuidV7'
        updatedBy:
          $ref: '#/components/schemas/UuidV7'
        lastReason:
          type: string
    FacilityPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        nextCursor:
          oneOf:
          - $ref: '#/components/schemas/UuidV7'
          - type: 'null'
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - message
      - details
      - metadata
      - occurred_at
      - timestamp
      - correlation_id
      - trace_id
      properties:
        type:
          type: string
          description: Stable InfraNexum problem type URI.
        title:
          type: string
          description: Short human-readable problem summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe redacted problem detail.
        instance:
          type: string
          description: Request URI associated with this occurrence.
        code:
          type: string
          description: Stable machine-readable InfraNexum error code.
        message:
          type: string
          deprecated: true
          description: Legacy compatibility alias of detail.
        details:
          type: object
          additionalProperties: true
          description: Structured validation or conflict details.
        metadata:
          type: object
          additionalProperties: true
          description: Reserved non-sensitive problem metadata.
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp of this problem occurrence.
        timestamp:
          type: string
          format: date-time
          deprecated: true
          description: Legacy compatibility alias of occurred_at.
        correlation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Canonical request UUIDv7 correlation identifier.
        trace_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Compatibility trace identifier equal to correlation_id.
      additionalProperties: false
  responses:
    FacilityMutation:
      description: Facility state with a strong ETag.
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Facility'
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Unauthorized:
      description: Authentication required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Forbidden:
      description: Authorization or capability denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    NotFound:
      description: Facility not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Conflict:
      description: Version, idempotency, quota or hierarchy conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    UnprocessableEntity:
      description: Governance scope or hierarchy constraint rejected.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
  headers:
    CorrelationId:
      description: Canonical UUIDv7 correlation identifier assigned to the request.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
