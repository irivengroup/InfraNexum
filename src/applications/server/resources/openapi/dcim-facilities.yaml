openapi: 3.1.0
info:
  title: InfraNexum DCIM Physical Facilities API
  version: 2.0.0-alpha.0.106
  description: PGM-07-E04 governed physical hierarchy for sites, buildings, floors, rooms and technical zones.
servers:
- url: /
security:
- LocalSessionCookie: []
x-tagGroups:
- name: DCIM
  tags:
  - DCIM / Facilities
x-infranexum-published-events:
- dcim.site.created.v1
- dcim.building.created.v1
- dcim.floor.created.v1
- dcim.room.created.v1
- dcim.zone.created.v1
- dcim.site.updated.v1
- dcim.building.updated.v1
- dcim.floor.updated.v1
- dcim.room.updated.v1
- dcim.zone.updated.v1
- dcim.site.status_changed.v1
- dcim.building.status_changed.v1
- dcim.floor.status_changed.v1
- dcim.room.status_changed.v1
- dcim.zone.status_changed.v1
- dcim.site.archived.v1
- dcim.site.deleted.v1
- dcim.room.locked.v1
tags:
- name: DCIM / Facilities
  description: Organization-scoped physical topology and lifecycle governance.
paths:
  /api/v1/dcim/sites:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
      - DCIM / Facilities
      operationId: listDcimSites
      summary: List DCIM sites
      x-infranexum-permission:
        mode: permission
        code: dcim.site.read
      x-infranexum-capability: dcim.facilities
      parameters:
      - name: organization_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: subdivision_id
        in: query
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: parent_id
        in: query
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/FacilityStatus'
      - name: country_code
        in: query
        description: ISO 3166-1 alpha-2 country filter for sites.
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
      - name: cursor
        in: query
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Stable UUIDv7 cursor page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - DCIM / Facilities
      operationId: createDcimSite
      summary: Create a DCIM site
      x-infranexum-permission:
        mode: permission
        code: dcim.site.create
      x-infranexum-capability: dcim.facilities
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteFacility'
      responses:
        '201':
          $ref: '#/components/responses/FacilityMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/dcim/sites/{facilityId}:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/FacilityId'
    get:
      tags:
      - DCIM / Facilities
      operationId: getDcimSite
      summary: Get a DCIM site
      x-infranexum-permission:
        mode: permission
