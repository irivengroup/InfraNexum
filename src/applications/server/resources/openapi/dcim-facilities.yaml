        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: INFRANEXUM_SESSION
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated retry key scoped to the authenticated actor and operation. Reuse with different request semantics
        returns HTTP 409.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^(W/)?"?ver-[1-9][0-9]*"?$
    FacilityId:
      name: facilityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    FacilityStatus:
      type: string
      enum:
      - draft
      - active
      - suspended
      - maintenance
      - locked
      - inactive
      - archived
      - deleted
    CreateSiteFacility:
      type: object
      additionalProperties: false
      required:
      - organizationId
      - subdivisionId
      - code
      - displayName
      - addressLine1
      - postalCode
      - city
      - countryCode
      - timezone
      - reason
      properties:
        organizationId:
          $ref: '#/components/schemas/UuidV7'
        subdivisionId:
          $ref: '#/components/schemas/UuidV7'
        code:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$
        displayName:
          type: string
          minLength: 3
          maxLength: 128
        addressLine1:
          type: string
          minLength: 1
          maxLength: 128
        addressLine2:
          type: string
          minLength: 1
          maxLength: 128
        postalCode:
          type: string
          minLength: 1
          maxLength: 16
        city:
          type: string
          minLength: 1
          maxLength: 64
        countryCode:
          type: string
          pattern: ^[A-Za-z]{2}$
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        description:
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    UpdateSiteFacility:
      type: object
      additionalProperties: false
      required:
      - displayName
      - addressLine1
      - postalCode
      - city
      - countryCode
      - timezone
      - reason
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 128
        addressLine1:
          type: string
          minLength: 1
          maxLength: 128
        addressLine2:
          type: string
          minLength: 1
          maxLength: 128
        postalCode:
          type: string
          minLength: 1
          maxLength: 16
        city:
          type: string
          minLength: 1
          maxLength: 64
        countryCode:
          type: string
          pattern: ^[A-Za-z]{2}$
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        description:
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    CreateBuildingFacility:
      type: object
