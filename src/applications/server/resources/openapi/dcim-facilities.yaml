  /api/v1/dcim/zones/{facilityId}/status:
    post:
      tags:
      - DCIM / Facilities
      operationId: changeDcimZoneStatus
      summary: Change DCIM zone lifecycle status
      description: 'The Server resolves the atomic permission from the target transition: update by default, archive/delete when applicable, and
        dcim.room.lock for room lock.'
      x-infranexum-permission:
        mode: permission
        code: dcim.zone.update
      x-infranexum-capability: dcim.facilities
      parameters:
