openapi: 3.1.0
info:
  title: InfraNexum ITAM Partner Catalogue API
  version: 2.0.0-alpha.0.116
  description: Governed Partner aggregate and role-filtered manufacturer/publisher/support catalogues for PGM-07-E01.
servers:
- url: /
security:
- LocalSessionCookie: []
x-tagGroups:
- name: ITAM
  tags:
  - ITAM / Partners
x-infranexum-published-events:
- itam.partner.created.v1
- itam.partner.authorized.v1
- itam.partner.suspended.v1
tags:
- name: ITAM / Partners
  description: Single governed catalogue for manufacturers, publishers, suppliers, support providers, integrators and recyclers.
paths:
  /api/v1/itam/partners:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
      - ITAM / Partners
      operationId: listItamPartners
      summary: List governed partners
      description: Without organization_id, the caller must hold the read permission at platform scope. Organization-scoped callers provide
        organization_id.
      x-infranexum-permission:
        mode: permission
        code: itam.partner.read
      x-infranexum-capability: itam.partners
      x-infranexum-minimum-installation-profile: lite
      parameters:
      - name: organization_id
        in: query
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/PartnerRole'
      - name: authorization_status
        in: query
        schema:
          $ref: '#/components/schemas/PartnerAuthorizationStatus'
      - name: country_code
        in: query
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
      - name: accreditation
        in: query
        schema:
          type: string
          maxLength: 120
      - name: effective_on
        in: query
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Stable UUIDv7-cursor page of partners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - ITAM / Partners
      operationId: createItamPartner
      summary: Create a Partner draft
      x-infranexum-permission:
        mode: permission
        code: itam.partner.create
      x-infranexum-capability: itam.partners
      x-infranexum-minimum-installation-profile: lite
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartner'
      responses:
        '201':
          $ref: '#/components/responses/PartnerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/itam/partners/{partnerId}/submit-approval:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/PartnerId'
    post:
      tags:
      - ITAM / Partners
      operationId: submitItamPartnerApproval
      summary: Submit a Partner draft for approval
      x-infranexum-permission:
        mode: permission
        code: itam.partner.approve
      x-infranexum-capability: itam.partners
      x-infranexum-minimum-installation-profile: lite
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionPartner'
      responses: &id001
        '200':
          $ref: '#/components/responses/PartnerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/itam/partners/{partnerId}/authorize:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/PartnerId'
    post:
      tags:
      - ITAM / Partners
      operationId: authorizeItamPartner
      summary: Authorize a Partner for new selections
      x-infranexum-permission:
        mode: permission
        code: itam.partner.approve
      x-infranexum-capability: itam.partners
      x-infranexum-minimum-installation-profile: lite
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionPartner'
      responses: *id001
  /api/v1/itam/partners/{partnerId}/suspend:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/PartnerId'
    post:
      tags:
      - ITAM / Partners
      operationId: suspendItamPartner
      summary: Suspend a Partner from new selections
      x-infranexum-permission:
        mode: permission
        code: itam.partner.suspend
      x-infranexum-capability: itam.partners
      x-infranexum-minimum-installation-profile: lite
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionPartner'
      responses: *id001
components:
  securitySchemes:
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: INX_SESSION
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated retry key scoped to the authenticated actor and operation. Reuse with different request semantics
        returns HTTP 409.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong or weak ETag containing the current Partner version, for example `"ver-2"`.
      schema:
        type: string
        pattern: ^(W/)?"ver-[1-9][0-9]*"$
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PartnerRole:
      type: string
      enum:
      - manufacturer
      - software_publisher
      - supplier
      - third_party_support_provider
      - integrator
      - recycler
    PartnerAuthorizationStatus:
      type: string
      enum:
      - draft
      - pending_approval
      - active
      - suspended
      - retired
    ExternalId:
      type: object
      additionalProperties: false
      required:
      - authority
      - value
      properties:
        authority:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-z][a-z0-9._-]{1,63}$
        value:
          type: string
          minLength: 1
          maxLength: 240
    Accreditation:
      type: object
      additionalProperties: false
      required:
      - code
      - issuer
      - validFrom
      - evidenceReference
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 120
        issuer:
          type: string
          minLength: 2
          maxLength: 200
        validFrom:
          type: string
          format: date
        validUntil:
          type:
          - string
          - 'null'
          format: date
        evidenceReference:
          type: string
          minLength: 2
          maxLength: 240
    Contact:
      type: object
      additionalProperties: false
      required:
      - type
      - name
      properties:
        type:
          type: string
          minLength: 2
          maxLength: 32
        name:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type:
          - string
          - 'null'
          maxLength: 320
        phone:
          type:
          - string
          - 'null'
          maxLength: 64
        uri:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
    CreatePartner:
      type: object
      additionalProperties: false
      required:
      - governingOrganizationId
      - code
      - legalName
      - displayName
      - countryCode
      - roles
      - validFrom
      - reason
      properties:
        governingOrganizationId:
          $ref: '#/components/schemas/UuidV7'
        governingSubdivisionId:
          oneOf:
          - $ref: '#/components/schemas/UuidV7'
          - type: 'null'
        code:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{2,31}$
        legalName:
          type: string
          minLength: 2
          maxLength: 255
        displayName:
          type: string
          minLength: 2
          maxLength: 255
        countryCode:
          type: string
          pattern: ^[A-Za-z]{2}$
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PartnerRole'
        validFrom:
          type: string
          format: date
        validUntil:
          type:
          - string
          - 'null'
          format: date
        officialWebsite:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
        supportPortal:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
        aliases:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 255
        externalIds:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ExternalId'
        accreditations:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Accreditation'
        contacts:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Contact'
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    TransitionPartner:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    Partner:
      type: object
      additionalProperties: false
      required:
      - id
      - governingOrganizationId
      - code
      - legalName
      - displayName
      - countryCode
      - roles
      - authorizationStatus
      - validFrom
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        governingOrganizationId:
          $ref: '#/components/schemas/UuidV7'
        governingSubdivisionId:
          oneOf:
          - $ref: '#/components/schemas/UuidV7'
          - type: 'null'
        code:
          type: string
          minLength: 3
          maxLength: 32
        legalName:
          type: string
          minLength: 2
          maxLength: 255
        displayName:
          type: string
          minLength: 2
          maxLength: 255
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PartnerRole'
        authorizationStatus:
          $ref: '#/components/schemas/PartnerAuthorizationStatus'
        validFrom:
          type: string
          format: date
        validUntil:
          type:
          - string
          - 'null'
          format: date
        officialWebsite:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
        supportPortal:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
        aliases:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 2
            maxLength: 255
        externalIds:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ExternalId'
        accreditations:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Accreditation'
        contacts:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Contact'
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PartnerPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Partner'
        nextCursor:
          oneOf:
          - $ref: '#/components/schemas/UuidV7'
          - type: 'null'
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - message
      - details
      - metadata
      - occurred_at
      - timestamp
      - correlation_id
      - trace_id
      properties:
        type:
          type: string
          description: Stable InfraNexum problem type URI.
        title:
          type: string
          description: Short human-readable problem summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe redacted problem detail.
        instance:
          type: string
          description: Request URI associated with this occurrence.
        code:
          type: string
          description: Stable machine-readable InfraNexum error code.
        message:
          type: string
          deprecated: true
          description: Legacy compatibility alias of detail.
        details:
          type: object
          additionalProperties: true
          description: Structured validation or conflict details.
        metadata:
          type: object
          additionalProperties: true
          description: Reserved non-sensitive problem metadata.
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp of this problem occurrence.
        timestamp:
          type: string
          format: date-time
          deprecated: true
          description: Legacy compatibility alias of occurred_at.
        correlation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Canonical request UUIDv7 correlation identifier.
        trace_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Compatibility trace identifier equal to correlation_id.
      additionalProperties: false
  responses:
    PartnerResponse:
      description: Partner aggregate with an ETag carrying the optimistic version.
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Partner'
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Unauthorized:
      description: Authentication required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Forbidden:
      description: Capability or authorization denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    NotFound:
      description: Partner not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Conflict:
      description: Duplicate, lifecycle, optimistic-version, idempotency or quota conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    UnprocessableEntity:
      description: Governing scope or authorization period is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
  headers:
    CorrelationId:
      description: Canonical UUIDv7 correlation identifier assigned to the request.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
