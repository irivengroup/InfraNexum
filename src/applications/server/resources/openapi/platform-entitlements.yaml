openapi: 3.1.0
info:
  title: InfraNexum Platform Entitlements API
  version: 2.0.0-alpha.0.125
tags:
- name: Platform / Entitlements / Evaluation
  description: Read-only evaluation and activation lifecycle status.
x-tagGroups:
- name: Platform
  tags:
  - Platform / Entitlements / Evaluation
paths:
  /api/v1/platform/evaluation/status:
    get:
      tags:
      - Platform / Entitlements / Evaluation
      operationId: getPlatformEvaluationStatus
      security:
      - LocalSessionCookie: []
      summary: Read the authoritative evaluation and activation lifecycle status
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current secret-free lifecycle decision.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              description: Prevents caching of lifecycle decisions.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationStatus'
        '400':
          description: The supplied X-Correlation-ID is not a canonical UUIDv7 identifier.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Entitlement runtime is unavailable or failed closed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-infranexum-capability: platform.entitlements
      x-infranexum-permission:
        mode: permission
        code: platform.profile.read
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation identifier. Must be canonical lowercase RFC 9562 UUIDv7.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  headers:
    CorrelationId:
      description: Canonical UUIDv7 correlation identifier assigned to the request.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  schemas:
    EvaluationStatus:
      type: object
      additionalProperties: false
      required:
      - installationId
      - profile
      - allocationTier
      - phase
      - evaluatedAt
      - acceptedSequence
      - serviceStartupPermitted
      - mutationPermitted
      properties:
        installationId:
          type: string
          format: uuid
        profile:
          type: string
          enum: [LITE, PRO, ENTERPRISE]
        allocationTier:
          type: string
          enum: [STANDARD, ADVANCED, ULTIMATE]
        phase:
          type: string
          enum: [EVALUATION, CONVERSION_REQUIRED, ACTIVE, GRACE, HARD_STOPPED]
        evaluatedAt:
          type: string
          format: date-time
        evaluationStartedAt:
          type: [string, 'null']
          format: date-time
        conversionRequiredAt:
          type: [string, 'null']
          format: date-time
        hardStopAt:
          type: [string, 'null']
          format: date-time
        validUntil:
          type: [string, 'null']
          format: date-time
        graceUntil:
          type: [string, 'null']
          format: date-time
        acceptedSequence:
          type: integer
          format: int64
          minimum: 0
        acceptedActivationId:
          type: [string, 'null']
          format: uuid
        serviceStartupPermitted:
          type: boolean
        mutationPermitted:
          type: boolean
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - message
      - details
      - metadata
      - occurred_at
      - timestamp
      - correlation_id
      - trace_id
      properties:
        type:
          type: string
          description: Stable InfraNexum problem type URI.
        title:
          type: string
          description: Short human-readable problem summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe redacted problem detail.
        instance:
          type: string
          description: Request URI associated with this occurrence.
        code:
          type: string
          description: Stable machine-readable InfraNexum error code.
        message:
          type: string
          deprecated: true
          description: Legacy compatibility alias of detail.
        details:
          type: object
          additionalProperties: true
          description: Structured validation or conflict details.
        metadata:
          type: object
          additionalProperties: true
          description: Reserved non-sensitive problem metadata.
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp of this problem occurrence.
        timestamp:
          type: string
          format: date-time
          deprecated: true
          description: Legacy compatibility alias of occurred_at.
        correlation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Canonical request UUIDv7 correlation identifier.
        trace_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Compatibility trace identifier equal to correlation_id.
      additionalProperties: false
  responses: {}
