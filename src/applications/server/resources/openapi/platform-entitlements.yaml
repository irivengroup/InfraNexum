openapi: 3.1.0
info:
  title: InfraNexum Platform Entitlements API
  version: 2.0.0-alpha.0.36
tags:
  - name: Platform / Entitlements / Evaluation
    description: Read-only evaluation and activation lifecycle status.
x-tagGroups:
  - name: Platform
    tags:
      - Platform / Entitlements / Evaluation
paths:
  /api/v1/platform/evaluation/status:
    get:
      tags:
        - Platform / Entitlements / Evaluation
      operationId: getPlatformEvaluationStatus
      summary: Read the authoritative evaluation and activation lifecycle status
      responses:
        '200':
          description: Current secret-free lifecycle decision.
          headers:
            Cache-Control:
              description: Prevents caching of lifecycle decisions.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/src/components/schemas/EvaluationStatus'
        '503':
          description: Entitlement runtime is unavailable or failed closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/src/components/schemas/Problem'
components:
  schemas:
    EvaluationStatus:
      type: object
      additionalProperties: false
      required:
        - installationId
        - profile
        - allocationTier
        - phase
        - evaluatedAt
        - acceptedSequence
        - serviceStartupPermitted
        - mutationPermitted
      properties:
        installationId:
          type: string
          format: uuid
        profile:
          type: string
          enum: [LITE, PRO, ENTERPRISE]
        allocationTier:
          type: string
          enum: [STANDARD, ADVANCED, ULTIMATE]
        phase:
          type: string
          enum: [EVALUATION, CONVERSION_REQUIRED, ACTIVE, GRACE, HARD_STOPPED]
        evaluatedAt:
          type: string
          format: date-time
        evaluationStartedAt:
          type: [string, 'null']
          format: date-time
        conversionRequiredAt:
          type: [string, 'null']
          format: date-time
        hardStopAt:
          type: [string, 'null']
          format: date-time
        validUntil:
          type: [string, 'null']
          format: date-time
        graceUntil:
          type: [string, 'null']
          format: date-time
        acceptedSequence:
          type: integer
          format: int64
          minimum: 0
        acceptedActivationId:
          type: [string, 'null']
          format: uuid
        serviceStartupPermitted:
          type: boolean
        mutationPermitted:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, occurred_at]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        occurred_at:
          type: string
          format: date-time
        trace_id:
          type: [string, 'null']
