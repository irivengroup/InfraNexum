        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: INX_SESSION
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated retry key scoped to the authenticated actor and operation. Reuse with different request semantics
        returns HTTP 409.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^(?:W/)?"?ver-[1-9][0-9]*"?$
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    Reason:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    PageQuery:
      type: object
    WarrantyRequest:
      type: object
      additionalProperties: false
      required:
      - manufacturerPartnerId
      - warrantyTypeId
      - coverageLevel
      - warrantyStartDate
      - warrantyEndDate
      - manufacturerSupportEndDate
      - proofReference
      - source
      - reason
      properties:
        manufacturerPartnerId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        warrantyTypeId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        coverageLevel:
          type: string
          minLength: 2
          maxLength: 120
        warrantyStartDate:
          type: string
          format: date
        warrantyEndDate:
          type: string
          format: date
        manufacturerSupportEndDate:
          type: string
          format: date
        contractOrCertificateNumber:
          type: string
          maxLength: 160
        proofReference:
          type: string
          minLength: 2
          maxLength: 240
        source:
          type: string
          enum:
          - manual
          - import
          - integration
          - migration
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    LicenseRequest:
      type: object
      additionalProperties: false
      description: Contract metadata only. Raw license/product/serial keys are deliberately not accepted until Secret Service/PKI/KMS is
        available.
      required:
      - publisherPartnerId
      - contractNumber
      - licenseModel
      - usageRights
      - entitlementQuantity
      - startsOn
      - publisherSupportEndDate
      - proofReference
      - source
      - reason
      properties:
        publisherPartnerId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        contractNumber:
          type: string
          minLength: 1
          maxLength: 160
        licenseModel:
          type: string
          minLength: 1
          maxLength: 120
        usageRights:
          type: string
          minLength: 1
          maxLength: 2000
        entitlementQuantity:
          type: integer
          format: int64
          minimum: 1
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        publisherSupportEndDate:
          type: string
          format: date
        proofReference:
          type: string
          minLength: 2
          maxLength: 240
        source:
          type: string
          enum:
          - manual
          - import
          - integration
          - migration
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    SupportCoverageRequest:
      type: object
      additionalProperties: false
      required:
      - providerPartnerId
      - authorizationId
      - coverageType
      - serviceLevel
      - startsOn
      - endsOn
      - proofReference
      - reason
      properties:
        providerPartnerId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        authorizationId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        contractReference:
          type: string
          maxLength: 160
        coverageType:
          type: string
          minLength: 1
          maxLength: 120
        serviceLevel:
          type: string
          minLength: 1
          maxLength: 160
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        proofReference:
          type: string
          minLength: 2
          maxLength: 240
        reason:
          type: string
          minLength: 2
          maxLength: 1024
    SupportAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - providerPartnerId
      - organizationId
      - supportedManufacturerIds
      - supportedObjectTypes
      - serviceHours
      - timeZoneId
      - serviceLevels
      - escalationContactTypes
      - validFrom
      - reason
      properties:
        providerPartnerId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        organizationId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        supportedManufacturerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        supportedObjectTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        subdivisionScopes:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        serviceHours:
          type: string
          minLength: 1
          maxLength: 240
        timeZoneId:
          type: string
          minLength: 1
          maxLength: 80
        serviceLevels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        escalationContactTypes:
          type: array
          minItems: 1
