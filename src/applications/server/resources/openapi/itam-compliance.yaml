openapi: 3.1.0
info:
  title: InfraNexum ITAM Warranty, Support and License API
  version: 2.0.0-alpha.0.79
  description: PGM-07-E03 contractual governance. Warranty, support-provider authorization,
    third-party support coverage, software-license metadata, immutable revision evidence
    and deterministic deadline alerts.
servers:
- url: /
security:
- LocalSessionCookie: []
x-tagGroups:
- name: ITAM
  tags:
  - ITAM / Compliance
x-infranexum-published-events:
- itam.warranty.created.v1
- itam.warranty.updated.v1
- itam.warranty.expiring.v1
- itam.warranty.expired.v1
- itam.warranty.support_expiring.v1
- itam.license.created.v1
- itam.license.updated.v1
- itam.license.expiring.v1
- itam.license.expired.v1
- itam.license.support_expiring.v1
- itam.support_authorization.created.v1
- itam.support_authorization.activated.v1
- itam.support_authorization.suspended.v1
- itam.support_coverage.created.v1
- itam.support_coverage.updated.v1
- itam.support_coverage.activated.v1
- itam.support_coverage.expiring.v1
- itam.support_coverage.expired.v1
- itam.support_coverage.review_required.v1
tags:
- name: ITAM / Compliance
  description: Organization-governed warranties, support scopes, license contracts
    and contractual evidence.
paths:
  /api/v1/itam/assets/{assetId}/warranties:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/AssetId'
    - &id002
      name: cursor
      in: query
      schema: &id001
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    - &id003
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    get:
      tags:
      - ITAM / Compliance
      operationId: listItamAssetWarrantys
      summary: List asset warranties
      x-infranexum-permission: itam.warranty.read
      x-infranexum-capability: itam.compliance
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warranty'
                  nextCursor: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - ITAM / Compliance
      operationId: createItamWarranty
      summary: Create warrantie draft
      x-infranexum-permission: itam.warranty.manage
      x-infranexum-capability: itam.compliance
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarrantyRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warranty'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
