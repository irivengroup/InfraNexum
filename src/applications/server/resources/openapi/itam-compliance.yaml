    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - message
      - details
      - metadata
      - occurred_at
      - timestamp
      - correlation_id
      - trace_id
      properties:
        type:
          type: string
          description: Stable InfraNexum problem type URI.
        title:
          type: string
          description: Short human-readable problem summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe redacted problem detail.
        instance:
          type: string
          description: Request URI associated with this occurrence.
        code:
          type: string
          description: Stable machine-readable InfraNexum error code.
        message:
          type: string
          deprecated: true
          description: Legacy compatibility alias of detail.
        details:
          type: object
          additionalProperties: true
          description: Structured validation or conflict details.
        metadata:
          type: object
          additionalProperties: true
          description: Reserved non-sensitive problem metadata.
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp of this problem occurrence.
        timestamp:
          type: string
          format: date-time
          deprecated: true
          description: Legacy compatibility alias of occurred_at.
        correlation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Canonical request UUIDv7 correlation identifier.
        trace_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Compatibility trace identifier equal to correlation_id.
      additionalProperties: false
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-status: '400'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-status: '401'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Forbidden:
      description: Authorization denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-status: '403'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    NotFound:
      description: Record not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-status: '404'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    Conflict:
      description: Optimistic/idempotency/state conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-status: '409'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    UnprocessableEntity:
      description: Contractual invariant rejected
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-status: '422'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
  headers:
    CorrelationId:
      description: Canonical UUIDv7 correlation identifier assigned to the request.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
