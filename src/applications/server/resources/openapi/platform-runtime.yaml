openapi: 3.1.0
info:
  title: InfraNexum Platform Runtime API
  version: 2.0.0-alpha.0.126
tags:
- name: Platform / Runtime / Build
  description: Minimal non-sensitive bootstrap and build diagnostics.
- name: Platform / Runtime / Capabilities
  description: Effective installation capability registry and quota projection.
x-tagGroups:
- name: Platform
  tags:
  - Platform / Runtime / Build
  - Platform / Runtime / Capabilities
paths:
  /api/v1/system/build:
    get:
      tags:
      - Platform / Runtime / Build
      operationId: getSystemBuild
      security: []
      summary: Read non-sensitive Server build and placement information
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current Server build information.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      x-infranexum-capability: platform.bootstrap
      x-infranexum-permission:
        mode: anonymous
  /api/v1/platform/capabilities:
    get:
      tags:
      - Platform / Runtime / Capabilities
      operationId: getPlatformCapabilities
      security:
      - LocalSessionCookie: []
      summary: Read the effective installation capability snapshot
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current secret-free capability snapshot.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitySnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-infranexum-capability: platform.bootstrap
      x-infranexum-permission:
        mode: permission
        code: platform.capability.read
  /api/v1/platform/capabilities/{code}:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - name: code
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$'
    get:
      tags:
      - Platform / Runtime / Capabilities
      operationId: getPlatformCapability
      security:
      - LocalSessionCookie: []
      summary: Explain one capability decision for the effective installation
      responses:
        '200':
          description: Current decision for the requested capability.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-infranexum-capability: platform.bootstrap
      x-infranexum-permission:
        mode: permission
        code: platform.capability.read
  /api/v1/platform/quotas:
    get:
      tags:
      - Platform / Runtime / Capabilities
      operationId: getPlatformQuotas
      security:
      - LocalSessionCookie: []
      summary: Read the effective quota allocation for the installation
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current effective quota allocation.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-infranexum-capability: platform.bootstrap
      x-infranexum-permission:
        mode: permission
        code: platform.capability.read
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation identifier. Must be canonical lowercase RFC 9562 UUIDv7.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  headers:
    CorrelationId:
      description: Canonical UUIDv7 correlation identifier assigned to the request.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    NoStore:
      description: Prevents caching of installation decisions.
      schema:
        type: string
        const: no-store
  responses:
    BadRequest:
      description: Invalid request or correlation identifier.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated actor is not authorized.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested capability does not exist or is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Capability runtime is unavailable or failed closed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected internal failure.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    BuildInfo:
      type: object
      additionalProperties: false
      required: [product, version, architectureBaseline, component, instanceId, mode, region, site]
      properties:
        product: {type: string}
        version: {type: string}
        architectureBaseline: {type: string}
        component: {type: string}
        instanceId: {type: string}
        mode: {type: string}
        region: {type: string}
        site: {type: string}
    CapabilitySnapshot:
      type: object
      additionalProperties: false
      required: [catalogVersion, profileVersion, capabilityHash, evaluatedAt, capabilities]
      properties:
        catalogVersion: {type: string}
        profileVersion: {type: integer, format: int64, minimum: 0}
        capabilityHash: {type: string}
        evaluatedAt: {type: string, format: date-time}
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityDecision'
    CapabilityDecision:
      type: object
      additionalProperties: false
      required:
      - capabilityCode
      - available
      - reasonCode
      - profile
      - topology
      - roles
      - traits
      - dependencyStatus
      - activationState
      - catalogVersion
      - capabilityHash
      - evaluatedAt
      - profileVersion
      properties:
        capabilityCode: {type: string}
        available: {type: boolean}
        reasonCode: {type: string}
        profile: {type: string}
        topology: {type: string}
        roles: {type: array, items: {type: string}}
        traits: {type: array, items: {type: string}}
        dependencyStatus: {type: string}
        activationState: {type: string}
        catalogVersion: {type: string}
        capabilityHash: {type: string}
        evaluatedAt: {type: string, format: date-time}
        profileVersion: {type: integer, format: int64, minimum: 0}
    QuotaPlan:
      type: object
      additionalProperties: false
      required: [catalogVersion, profile, allocationTier, quotas]
      properties:
        catalogVersion: {type: string}
        profile: {type: string}
        allocationTier: {type: string}
        quotas:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - message
      - details
      - metadata
      - occurred_at
      - timestamp
      - correlation_id
      - trace_id
      properties:
        type: {type: string, description: Stable InfraNexum problem type URI.}
        title: {type: string, description: Short human-readable problem summary.}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, description: Safe redacted problem detail.}
        instance: {type: string, description: Request URI associated with this occurrence.}
        code: {type: string, description: Stable machine-readable InfraNexum error code.}
        message: {type: string, deprecated: true, description: Legacy compatibility alias of detail.}
        details: {type: object, additionalProperties: true, description: Structured validation or conflict details.}
        metadata: {type: object, additionalProperties: true, description: Reserved non-sensitive problem metadata.}
        occurred_at: {type: string, format: date-time, description: UTC timestamp of this problem occurrence.}
        timestamp: {type: string, format: date-time, deprecated: true, description: Legacy compatibility alias of occurred_at.}
        correlation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Canonical request UUIDv7 correlation identifier.
        trace_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Compatibility trace identifier equal to correlation_id.
      additionalProperties: false
