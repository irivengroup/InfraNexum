      x-infranexum-permission: {mode: permission, code: integrations.sync.read}
      x-infranexum-pagination: offset
  /api/v1/integrations/sync/{connectorKey}/checkpoints:
    get:
      tags: [Integrations / Connectors / Synchronization]
      operationId: listConnectorSynchronizationCheckpoints
      summary: List append-only connector checkpoints without exposing raw cursors
      security: [{LocalSessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ConnectorKey'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Monotonic checkpoint history. Raw cursor values remain server-internal.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Page-Limit: {$ref: '#/components/headers/PageLimit'}
            X-Next-Offset: {$ref: '#/components/headers/NextOffset'}
          content:
            application/json:
              schema: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ConnectorSyncCheckpoint'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-infranexum-capability: integrations.connectors
      x-infranexum-permission: {mode: permission, code: integrations.sync.read}
      x-infranexum-pagination: offset
  /api/v1/integrations/sync/{connectorKey}/execute:
    post:
      tags: [Integrations / Connectors / Synchronization]
      operationId: executeConnectorSynchronization
      summary: Execute a governed mutating synchronization with durable checkpoints
      description: Federated-read connectors are deliberately rejected here; they remain query-only until an explicit mutating authority mapping and approved handler exist.
      security: [{LocalSessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ConnectorKey'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConnectorSyncExecutionRequest'}}}
      responses:
        '200':
          description: Durable run state after synchronous bounded processing.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/ConnectorSyncRun'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-infranexum-capability: integrations.connectors
      x-infranexum-permission: {mode: permission, code: integrations.sync.execute}
      x-infranexum-idempotency: required
  /api/v1/integrations/sync/runs/{syncRunId}/resume:
    post:
      tags: [Integrations / Connectors / Synchronization]
      operationId: resumeConnectorSynchronization
      summary: Resume a paused synchronization from its last durable checkpoint
      security: [{LocalSessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SyncRunId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}
      responses:
        '200':
          description: Updated synchronization run.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/ConnectorSyncRun'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-infranexum-capability: integrations.connectors
      x-infranexum-permission: {mode: permission, code: integrations.sync.execute}
      x-infranexum-idempotency: required
  /api/v1/integrations/sync/runs/{syncRunId}/compensate:
    post:
      tags: [Integrations / Connectors / Synchronization]
      operationId: compensateConnectorSynchronization
      summary: Execute the approved compensation strategy for a synchronization run
      description: Compensation is fenced against newer connector revisions and appends a new restoration checkpoint instead of rewriting history. MANUAL and NONE_REQUIRED rollback strategies are not auto-executed.
      security: [{LocalSessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SyncRunId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}
      responses:
        '200':
          description: Compensated or compensation-failed run state.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/ConnectorSyncRun'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-infranexum-capability: integrations.connectors
      x-infranexum-permission: {mode: permission, code: integrations.sync.compensate}
      x-infranexum-idempotency: required
components:
  securitySchemes:
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: INX_SESSION
    WebhookHmac:
      type: apiKey
      in: header
      name: X-InfraNexum-Webhook-Signature
      description: HMAC-SHA256 over `<epoch-second>.<raw-body>`, paired with X-InfraNexum-Webhook-Timestamp.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional canonical lowercase RFC 9562 UUIDv7 correlation identifier.
      schema:
        $ref: '#/components/schemas/UuidV7'
    ConnectorKey:
      name: connectorKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConnectorKey'
    OptionalConnectorKey:
      name: connectorKey
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorKey'
    NotificationEndpointKey:
      name: endpointKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConnectorKey'
    OptionalNotificationEndpointKey:
      name: endpointKey
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ConnectorKey'
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    SyncRunId:
      name: syncRunId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    ConnectorDeliveryId:
      name: X-InfraNexum-Delivery-ID
      in: header
      required: true
      description: Provider delivery identifier. Reuse with a different payload hash returns HTTP 409.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9._:-]+$
    WebhookTimestamp:
      name: X-InfraNexum-Webhook-Timestamp
      in: header
      required: true
      description: Unix epoch seconds included in the HMAC canonical bytes and checked against endpoint clock skew.
      schema:
        type: string
        pattern: ^[0-9]{1,12}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated retry key scoped to the authenticated actor and operation.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[A-Za-z0-9._:-]+$
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    CorrelationId:
      description: Canonical UUIDv7 correlation identifier assigned to the request.
      schema:
        $ref: '#/components/schemas/UuidV7'
    NoStore:
      description: Prevents caching of connector operational state.
      schema:
        type: string
        const: no-store
    PageLimit:
      description: Effective bounded page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    NextOffset:
      description: Offset to request for the next page; omitted only when no later records exist.
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
  responses:
    BadRequest:
      description: Invalid connector request, header or payload.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Webhook signature or local session authentication failed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated operator lacks the required integration permission.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Connector endpoint or delivery is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Delivery identifier conflict or delivery state prevents the requested transition.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Webhook admission requires application/json.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Durable integration runtime is unavailable or failed closed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: External provider rejected the connector credential or returned an unsupported response.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ConnectorKey:
      type: string
      minLength: 3
      maxLength: 80
      pattern: ^[a-z0-9][a-z0-9._-]{2,79}$
    JiraAssetsConnectorDescriptor:
      type: object
      additionalProperties: false
      required:
      - connectorKey
      - provider
      - direction
      - authority
      - enabled
      properties:
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        provider:
          type: string
          const: jira-assets
        direction:
          type: string
          const: FEDERATED_READ
        authority:
          type: string
          const: EXTERNAL
        enabled:
          type: boolean
    JiraAssetsHealth:
      type: object
      additionalProperties: false
      required:
      - connectorKey
      - status
      - provider
      - direction
      - authority
      properties:
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        status:
          type: string
          const: UP
        provider:
          type: string
          const: jira-assets
        direction:
          type: string
          const: FEDERATED_READ
        authority:
          type: string
          const: EXTERNAL
    JiraAssetsSearchRequest:
      type: object
      additionalProperties: false
      required:
      - aql
      properties:
        aql:
          type: string
          minLength: 1
          maxLength: 4096
    JiraAssetsRemoteObject:
      type: object
      additionalProperties: false
      required:
      - id
      - globalId
      - objectKey
      - label
      - objectTypeId
      - objectTypeName
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
        globalId:
          type: string
          minLength: 1
          maxLength: 1024
        objectKey:
          type: string
          minLength: 1
          maxLength: 1024
        label:
          type: string
          minLength: 1
          maxLength: 1024
        objectTypeId:
          type: string
          minLength: 1
          maxLength: 1024
        objectTypeName:
          type: string
          minLength: 1
          maxLength: 1024
    ServiceNowConnectorDescriptor:
      type: object
      additionalProperties: false
      required:
      - connectorKey
      - provider
      - direction
      - authority
      - enabled
      properties:
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        provider:
          type: string
          const: service-now
        direction:
          type: string
          const: FEDERATED_READ
        authority:
          type: string
          const: EXTERNAL
        enabled:
          type: boolean
    ServiceNowHealth:
      type: object
      additionalProperties: false
      required:
      - connectorKey
      - status
      - provider
      - direction
      - authority
      properties:
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        status:
          type: string
          const: UP
        provider:
          type: string
          const: service-now
        direction:
          type: string
          const: FEDERATED_READ
        authority:
          type: string
          const: EXTERNAL
    ServiceNowSearchRequest:
      type: object
      additionalProperties: false
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9 _./:-]+$'
    ServiceNowRemoteConfigurationItem:
      type: object
      additionalProperties: false
      required:
      - sysId
      - name
      - className
      - updatedOn
      properties:
        sysId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        name:
          type: string
          maxLength: 1024
        className:
          type: string
          pattern: '^cmdb_ci(?:_[a-z0-9_]{1,56})?$'
        updatedOn:
          type: string
          maxLength: 1024
    NotificationEndpoint:
      type: object
      additionalProperties: false
      required:
      - endpointKey
      - transport
      - direction
      - authority
      - enabled
      properties:
        endpointKey:
          $ref: '#/components/schemas/ConnectorKey'
        transport:
          type: string
          const: SIGNED_WEBHOOK
        direction:
          type: string
          const: OUTBOUND
        authority:
          type: string
          const: INFRANEXUM
        enabled:
          type: boolean
    NotificationPublishRequest:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - endpointKeys
      - payload
      properties:
        eventId:
          type: string
          minLength: 8
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,199}$'
        eventType:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+){1,15}$'
        endpointKeys:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConnectorKey'
        payload:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
    NotificationAdmission:
      type: object
      additionalProperties: false
      required:
      - deliveryId
      - endpointKey
      - eventId
      - eventType
      - status
      - createdAt
      properties:
        deliveryId:
          $ref: '#/components/schemas/UuidV7'
        endpointKey:
          $ref: '#/components/schemas/ConnectorKey'
        eventId:
          type: string
          minLength: 8
          maxLength: 200
        eventType:
          type: string
          minLength: 3
          maxLength: 128
        status:
          type: string
          enum:
          - ADMITTED
          - DUPLICATE
        createdAt:
          type: string
          format: date-time
    NotificationDeadLetter:
      type: object
      additionalProperties: false
      required:
      - deliveryId
      - endpointKey
      - eventId
      - eventType
      - attempts
      - replayCount
      - createdAt
      properties:
        deliveryId:
          $ref: '#/components/schemas/UuidV7'
        endpointKey:
          $ref: '#/components/schemas/ConnectorKey'
        eventId:
          type: string
          minLength: 8
          maxLength: 200
        eventType:
          type: string
          minLength: 3
          maxLength: 128
        attempts:
          type: integer
          minimum: 0
        failureCode:
          type:
          - string
          - 'null'
          maxLength: 64
        replayCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        lastReplayedAt:
          type:
          - string
          - 'null'
          format: date-time
    NotificationRuntime:
      type: object
      additionalProperties: false
      required:
      - endpointKey
      - consecutiveDeadLetters
      - suspended
      - backlog
      - deadLetters
      properties:
        endpointKey:
          $ref: '#/components/schemas/ConnectorKey'
        consecutiveDeadLetters:
          type: integer
          minimum: 0
        suspendedUntil:
          type:
          - string
          - 'null'
          format: date-time
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        lastFailureAt:
          type:
          - string
          - 'null'
          format: date-time
        suspended:
          type: boolean
        backlog:
          type: integer
          minimum: 0
        deadLetters:
          type: integer
          minimum: 0
    ConnectorFieldAuthority:
      type: object
      additionalProperties: false
      required:
      - field
      - authority
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9_.-]{0,127}$
        authority:
          type: string
          enum:
          - EXTERNAL
          - INFRANEXUM
          - MANUAL
    ConnectorSyncExecutionRequest:
      type: object
      additionalProperties: false
      required: [direction, reason]
      properties:
        direction:
          type: string
          enum: [INBOUND, OUTBOUND, BIDIRECTIONAL]
        fields:
          type: array
          uniqueItems: true
          maxItems: 512
          items: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_.-]{0,127}$'}
          default: []
        propagateDeletions: {type: boolean, default: false}
        maxBatches: {type: integer, minimum: 1, maximum: 100, default: 10}
        reason: {type: string, minLength: 3, maxLength: 500}
    ConnectorSyncRun:
      type: object
      additionalProperties: false
      required: [runId, connectorKey, provider, direction, rollbackStrategy, status, fields, propagateDeletions, maxBatches, initialRevision, lastCheckpointRevision, startedAt, updatedAt]
      properties:
        runId: {$ref: '#/components/schemas/UuidV7'}
        connectorKey: {$ref: '#/components/schemas/ConnectorKey'}
        provider: {type: string, minLength: 1, maxLength: 80, pattern: '^[a-z][a-z0-9-]{0,79}$'}
        direction: {type: string, enum: [INBOUND, OUTBOUND, BIDIRECTIONAL]}
        rollbackStrategy: {type: string, enum: [LOCAL_CHECKPOINT, REMOTE_COMPENSATION, DUAL_COMPENSATION, MANUAL]}
        status: {type: string, enum: [RUNNING, PAUSED, SUCCEEDED, FAILED, COMPENSATING, COMPENSATED, COMPENSATION_FAILED]}
        fields:
          type: array
          uniqueItems: true
          maxItems: 512
          items: {type: string, maxLength: 128}
        propagateDeletions: {type: boolean}
        maxBatches: {type: integer, minimum: 1, maximum: 100}
        initialRevision: {type: integer, format: int64, minimum: 0}
        lastCheckpointRevision: {type: integer, format: int64, minimum: 0}
        failureCode: {type: [string, 'null'], maxLength: 64}
        startedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        compensationCheckpointRevision: {type: [integer, 'null'], format: int64, minimum: 1}
    ConnectorSyncCheckpoint:
      type: object
      additionalProperties: false
      description: Public checkpoint projection. The raw provider cursor is intentionally omitted.
      required: [checkpointId, connectorKey, runId, revision, kind, cursorSha256, processedCount, changedCount, rejectedCount, createdAt]
      properties:
        checkpointId: {$ref: '#/components/schemas/UuidV7'}
        connectorKey: {$ref: '#/components/schemas/ConnectorKey'}
        runId: {$ref: '#/components/schemas/UuidV7'}
        revision: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [PROGRESS, COMPENSATION]}
        cursorSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        processedCount: {type: integer, format: int64, minimum: 0}
        changedCount: {type: integer, format: int64, minimum: 0}
        rejectedCount: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
    ConnectorGovernancePolicy:
      type: object
      additionalProperties: false
      required:
      - connectorKey
      - provider
      - direction
      - authority
      - conflictStrategy
      - deletionPolicy
      - rollbackStrategy
      - executionEnabled
      - mutating
      - fields
      properties:
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        provider:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,79}$
        direction:
          $ref: '#/components/schemas/ConnectorSyncDirection'
        authority:
          type: string
          enum:
          - EXTERNAL
          - INFRANEXUM
          - MANUAL
        conflictStrategy:
          type: string
          enum:
          - REJECT
          - MANUAL
          - PREFER_AUTHORITY
        deletionPolicy:
          type: string
          enum:
          - IGNORE
          - TOMBSTONE
          - MANUAL
        rollbackStrategy:
          $ref: '#/components/schemas/ConnectorRollbackStrategy'
        executionEnabled:
          type: boolean
          description: True only when synchronization execution is explicitly admitted by connector policy.
        mutating:
          type: boolean
        fields:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/ConnectorFieldAuthority'
    ConnectorSyncDirection:
      type: string
      enum:
      - FEDERATED_READ
      - INBOUND
      - OUTBOUND
      - BIDIRECTIONAL
    ConnectorRollbackStrategy:
      type: string
      enum:
      - NONE_REQUIRED
      - LOCAL_CHECKPOINT
      - REMOTE_COMPENSATION
      - DUAL_COMPENSATION
      - MANUAL
    ConnectorSyncPlanRequest:
      type: object
      additionalProperties: false
      required:
      - direction
      - fields
      - propagateDeletions
      properties:
        direction:
          $ref: '#/components/schemas/ConnectorSyncDirection'
        fields:
          type: array
          maxItems: 512
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9_.-]{0,127}$
        propagateDeletions:
          type: boolean
    ConnectorSyncPlan:
      type: object
      additionalProperties: false
      required:
      - connectorKey
      - provider
      - configuredDirection
      - requestedDirection
      - decision
      - mutating
      - rollbackStrategy
      - fields
      - reasons
      properties:
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        provider:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,79}$
        configuredDirection:
          $ref: '#/components/schemas/ConnectorSyncDirection'
        requestedDirection:
          $ref: '#/components/schemas/ConnectorSyncDirection'
        decision:
          type: string
          enum:
          - ALLOW
          - DENY
        mutating:
          type: boolean
        rollbackStrategy:
          $ref: '#/components/schemas/ConnectorRollbackStrategy'
        fields:
          type: array
          maxItems: 512
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9_.-]{0,127}$
        reasons:
          type: array
          maxItems: 520
          items:
            type: string
            minLength: 1
            maxLength: 512
    WebhookAdmission:
      type: object
      additionalProperties: false
      required:
      - deliveryId
      - connectorKey
      - externalDeliveryId
      - status
      - receivedAt
      properties:
        deliveryId:
          $ref: '#/components/schemas/UuidV7'
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        externalDeliveryId:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - ADMITTED
          - DUPLICATE
        receivedAt:
          type: string
          format: date-time
    DeadLetter:
      type: object
      additionalProperties: false
      required:
      - deliveryId
      - connectorKey
      - externalDeliveryId
      - status
      - receivedAt
      - attempts
      - replayCount
      properties:
        deliveryId:
          $ref: '#/components/schemas/UuidV7'
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        externalDeliveryId:
          type: string
          minLength: 1
          maxLength: 200
        receivedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - DEAD_LETTER
        attempts:
          type: integer
          minimum: 0
        failureClass:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 1024
        replayCount:
          type: integer
          minimum: 0
        lastReplayAt:
          type:
          - string
          - 'null'
          format: date-time
    RuntimeState:
      type: object
      additionalProperties: false
      required:
      - connectorKey
      - consecutiveDeadLetters
      - suspended
      - backlog
      - deadLetters
      properties:
        connectorKey:
          $ref: '#/components/schemas/ConnectorKey'
        consecutiveDeadLetters:
          type: integer
          minimum: 0
        suspended:
          type: boolean
        suspendedUntil:
          type:
          - string
          - 'null'
          format: date-time
        backlog:
          type: integer
          minimum: 0
        deadLetters:
          type: integer
          minimum: 0
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 512
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - message
      - details
      - metadata
      - occurred_at
      - timestamp
      - correlation_id
      - trace_id
      properties:
        type:
          type: string
          description: Stable InfraNexum problem type URI.
        title:
          type: string
          description: Short human-readable problem summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe redacted problem detail.
        instance:
          type: string
          description: Request URI associated with this occurrence.
        code:
          type: string
          description: Stable machine-readable InfraNexum error code.
        message:
          type: string
          deprecated: true
          description: Legacy compatibility alias of detail.
        details:
          type: object
          additionalProperties: true
          description: Structured validation or conflict details.
        metadata:
          type: object
          additionalProperties: true
          description: Reserved non-sensitive problem metadata.
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp of this problem occurrence.
        timestamp:
          type: string
          format: date-time
          deprecated: true
          description: Legacy compatibility alias of occurred_at.
        correlation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Canonical request UUIDv7 correlation identifier.
        trace_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Compatibility trace identifier equal to correlation_id.
      additionalProperties: false
