        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorSyncPlanRequest'
      responses:
        '200':
          description: Deterministic dry-run decision. A policy denial is represented by decision DENY, not by executing a partial mutation.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorSyncPlan'
