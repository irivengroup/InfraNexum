openapi: 3.1.0
info:
  title: InfraNexum Integrations Connectors API
  version: 2.0.0-alpha.0.123
tags:
- name: Integrations / Connectors / Webhooks
  description: Authenticated connector webhook admission into the durable inbox.
- name: Integrations / Connectors / Dead Letter Queue
  description: Operational dead-letter inspection and controlled replay.
- name: Integrations / Connectors / Runtime
  description: Connector runtime health, suspension state and operator recovery.
- name: Integrations / Connectors / Governance
  description: Connector authority, sync direction, field ownership and rollback policy with fail-closed dry-run planning.
- name: Integrations / Connectors / Synchronization
  description: Durable connector synchronization runs, append-only checkpoints, explicit resume and governed compensation.
- name: Integrations / Jira Assets / Catalogue
  description: Configured Jira Assets Cloud connector instances and provider health.
- name: Integrations / Jira Assets / Federated Read
  description: Governed read-only AQL queries returning a minimized external projection.
- name: Integrations / ServiceNow / Catalogue
  description: Configured ServiceNow SaaS CMDB connector instances and provider health.
- name: Integrations / ServiceNow / Federated Read
  description: Governed read-only CMDB name searches returning a minimized external projection.
- name: Integrations / Notifications / Endpoints
  description: Configured signed-webhook notification destinations without secret or destination disclosure.
- name: Integrations / Notifications / Delivery
  description: Durable idempotent publication of operational events to explicit outbound endpoints.
- name: Integrations / Notifications / Recovery
  description: Dead-letter inspection, controlled replay and explicit endpoint recovery.
x-tagGroups:
- name: Integrations
  tags:
  - Integrations / Connectors / Webhooks
  - Integrations / Connectors / Dead Letter Queue
  - Integrations / Connectors / Runtime
  - Integrations / Connectors / Governance
  - Integrations / Connectors / Synchronization
  - Integrations / Jira Assets / Catalogue
  - Integrations / Jira Assets / Federated Read
  - Integrations / ServiceNow / Catalogue
  - Integrations / ServiceNow / Federated Read
  - Integrations / Notifications / Endpoints
  - Integrations / Notifications / Delivery
  - Integrations / Notifications / Recovery
paths:
  /api/v1/integrations/webhooks/{connectorKey}:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/ConnectorKey'
    post:
      tags:
      - Integrations / Connectors / Webhooks
      operationId: admitConnectorWebhook
      summary: Authenticate and durably admit a connector webhook delivery
      security:
      - WebhookHmac: []
      parameters:
      - $ref: '#/components/parameters/ConnectorDeliveryId'
      - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items: {}
      responses:
        '202':
          description: Delivery admitted or recognized as an identical duplicate.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAdmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-infranexum-capability: integrations.connectors
      x-infranexum-permission:
        mode: connector-signature
      x-infranexum-idempotency: connector-delivery
  /api/v1/integrations/dlq:
    get:
      tags:
      - Integrations / Connectors / Dead Letter Queue
      operationId: listConnectorDeadLetters
      summary: List connector deliveries in the dead-letter queue
      security:
      - LocalSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/OptionalConnectorKey'
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Bounded dead-letter page. Payload bodies are deliberately excluded.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Page-Limit:
              $ref: '#/components/headers/PageLimit'
            X-Next-Offset:
              $ref: '#/components/headers/NextOffset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeadLetter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-infranexum-capability: integrations.connectors
      x-infranexum-permission:
        mode: permission
        code: integrations.dlq.read
      x-infranexum-pagination: offset
  /api/v1/integrations/dlq/{deliveryId}/replay:
    post:
      tags:
      - Integrations / Connectors / Dead Letter Queue
      operationId: replayConnectorDeadLetter
      summary: Requeue one dead-letter delivery for controlled replay
      security:
      - LocalSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeliveryId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Delivery requeued as pending.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-infranexum-capability: integrations.connectors
      x-infranexum-permission:
        mode: permission
        code: integrations.dlq.replay
      x-infranexum-idempotency: required
  /api/v1/integrations/connectors/{connectorKey}/runtime:
