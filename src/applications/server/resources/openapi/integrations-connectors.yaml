  /api/v1/integrations/governance/{connectorKey}/sync-plan:
    post:
      tags:
      - Integrations / Connectors / Governance
      operationId: planConnectorSynchronization
      summary: Dry-run a synchronization intent against connector authority and rollback policy
      description: This operation never mutates local or provider data. DENY is returned in the response whenever the requested direction, field set, deletion semantics or rollback contract is not allowed by the configured connector policy.
      security:
      - LocalSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ConnectorKey'
