openapi: 3.1.0
info:
  title: InfraNexum Identity Access RBAC API
  version: 2.0.0-alpha.0.101
  description: PGM-03-E03 RBAC foundation for users, memberships, groups, roles, permissions, temporal scoped assignments and explainable
    permission evaluation. Local authentication establishes the actor; the Server RBAC PEP denies unregistered protected routes by default.
tags:
- name: IAM / Access / Users
- name: IAM / Access / Groups
- name: IAM / Access / Roles
- name: IAM / Access / Permissions
x-tagGroups:
- name: IAM
  tags:
  - IAM / Access / Users
  - IAM / Access / Groups
  - IAM / Access / Roles
  - IAM / Access / Permissions
x-infranexum-rbac-deny-by-default: true
security:
- LocalSessionCookie: []
paths:
  /api/v1/iam/users:
    parameters:
    - &id001
      $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
      - IAM / Access / Users
      operationId: searchIamUsers
      summary: Search IAM users with bounded pagination
      parameters:
      - &id004
        $ref: '#/components/parameters/Offset'
      - &id005
        $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.search
    post:
      tags:
      - IAM / Access / Users
      operationId: createIamUser
      summary: Create an IAM user
      parameters:
      - &id002
        $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Resource created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.create
  /api/v1/iam/users/{userId}:
    parameters:
    - *id001
    - &id003
      $ref: '#/components/parameters/UserId'
    get:
      tags:
      - IAM / Access / Users
      operationId: getIamUser
      summary: Read one IAM user
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.read
    patch:
      tags:
      - IAM / Access / Users
      operationId: updateIamUser
      summary: Update mutable IAM user attributes
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.update
    delete:
      tags:
      - IAM / Access / Users
      operationId: deleteIamUser
      summary: Soft-delete an IAM user
      parameters:
      - *id002
      - name: reason
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.delete
  /api/v1/iam/users/{userId}/activate:
    parameters:
    - *id001
    - *id003
    post:
      tags:
      - IAM / Access / Users
      operationId: activateIamUser
      summary: Activate an IAM user
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.activate
  /api/v1/iam/users/{userId}/suspend:
    parameters:
    - *id001
    - *id003
    post:
      tags:
      - IAM / Access / Users
      operationId: suspendIamUser
      summary: Suspend an IAM user
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.suspend
  /api/v1/iam/users/{userId}/memberships:
    parameters:
    - *id001
    - *id003
    get:
      tags:
      - IAM / Access / Users
      operationId: listIamUserMemberships
      summary: List organization and subdivision memberships for a user
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Page-Limit:
              description: Effective bounded page size.
              schema:
                type: integer
                minimum: 1
            X-Next-Offset:
              description: Offset for the next page; absent when the current page is terminal.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-pagination: offset
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          maximum: 1000000
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.read
    post:
      tags:
      - IAM / Access / Users
      operationId: createIamUserMembership
      summary: Create a temporal IAM membership
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '201':
          description: Resource created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.manage_membership
  /api/v1/iam/users/{userId}/roles:
    parameters:
    - *id001
    - *id003
    post:
      tags:
      - IAM / Access / Users
      operationId: assignIamUserRole
      summary: Assign a role directly to a user at an explicit scope
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleRequest'
      responses:
        '201':
          description: Resource created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.user.assign_role
  /api/v1/iam/groups/{groupId}/effective-members:
    parameters:
    - *id001
    - &id007
      $ref: '#/components/parameters/GroupId'
    get:
      tags:
      - IAM / Access / Groups
      operationId: getIamGroupEffectiveMembers
      summary: Resolve direct and inherited effective user members
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveMembers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.group.read
  /api/v1/organizations/{orgId}/groups:
    parameters:
    - *id001
    - &id006
      $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
      - IAM / Access / Groups
      operationId: searchIamGroups
      summary: Search groups in one organization
      parameters:
      - *id004
      - *id005
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.group.search
    post:
      tags:
      - IAM / Access / Groups
      operationId: createIamGroup
      summary: Create an IAM group in one organization
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroup'
      responses:
        '201':
          description: Resource created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.group.create
  /api/v1/organizations/{orgId}/groups/{groupId}:
    parameters:
    - *id001
    - *id006
    - *id007
    get:
      tags:
      - IAM / Access / Groups
      operationId: getIamGroup
      summary: Read one IAM group
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.group.read
    patch:
      tags:
      - IAM / Access / Groups
      operationId: updateIamGroup
      summary: Update an IAM group display name
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroup'
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.group.update
    delete:
      tags:
      - IAM / Access / Groups
      operationId: deleteIamGroup
      summary: Soft-delete an empty IAM group
      parameters:
      - *id002
      - name: reason
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.group.delete
  /api/v1/organizations/{orgId}/groups/{groupId}/members:
    parameters:
    - *id001
    - *id006
    - *id007
    post:
      tags:
      - IAM / Access / Groups
      operationId: addIamGroupMember
      summary: Add a user or nested group member
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberRequest'
      responses:
        '204':
          description: Mutation completed; no response body.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: conditional
        codes:
        - iam.group.add_member
        - iam.group.add_group
  /api/v1/organizations/{orgId}/groups/{groupId}/members/{memberId}:
    parameters:
    - *id001
    - *id006
    - *id007
    - $ref: '#/components/parameters/MemberId'
    delete:
      tags:
      - IAM / Access / Groups
      operationId: removeIamGroupMember
      summary: Remove a user or nested group member
      parameters:
      - *id002
      - name: memberType
        in: query
        required: false
        schema:
          type: string
          enum:
          - USER
          - GROUP
          default: USER
      - name: reason
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Mutation completed; no response body.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: conditional
        codes:
        - iam.group.remove_member
        - iam.group.remove_group
  /api/v1/organizations/{orgId}/groups/{groupId}/roles:
    parameters:
    - *id001
    - *id006
    - *id007
    post:
      tags:
      - IAM / Access / Groups
      operationId: assignIamGroupRole
      summary: Assign a role to a group
      parameters:
      - *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRoleRequest'
      responses:
        '201':
          description: Resource created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-infranexum-idempotency: required
      x-infranexum-capability: iam.access
      x-infranexum-permission:
        mode: permission
        code: iam.group.assign_role
  /api/v1/organizations/{orgId}/roles:
    parameters:
    - *id001
    - *id006
