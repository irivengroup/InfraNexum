openapi: 3.1.0
info:
  title: InfraNexum Local Authentication API
  version: 2.0.0-alpha.0.121
  description: Local human authentication foundation. Credentials are verified server-side with Argon2id; browser sessions are opaque,
    durable and revocable. The bootstrap administrator must replace its generated password before accessing protected v1 APIs. A validated
    session establishes the actor consumed by the downstream PGM-03-E03 RBAC PEP.
tags:
- name: IAM / Local authentication
x-tagGroups:
- name: IAM
  tags:
  - IAM / Local authentication
paths:
  /api/v1/iam/local-auth/session:
    post:
      tags:
      - IAM / Local authentication
      operationId: createLocalSession
      summary: Authenticate a local account and establish an opaque browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded. Opaque session and CSRF cookies are issued.
          headers:
            Set-Cookie:
              description: INX_SESSION HttpOnly cookie and INX_XSRF CSRF cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
      x-infranexum-idempotency: security-exempt
      x-infranexum-capability: iam.local-auth
      x-infranexum-permission:
        mode: anonymous
    get:
      tags:
      - IAM / Local authentication
      operationId: currentLocalSession
      summary: Resolve the current local browser session
      security:
      - LocalSessionCookie: []
      responses:
        '200':
          description: Current validated local session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/InvalidSession'
      x-infranexum-capability: iam.local-auth
      x-infranexum-permission:
        mode: authenticated-self
    delete:
      tags:
      - IAM / Local authentication
      operationId: revokeCurrentLocalSession
      summary: Revoke the current session and expire browser cookies
      security:
      - LocalSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      x-infranexum-idempotency: security-exempt
      x-infranexum-capability: iam.local-auth
      x-infranexum-permission:
        mode: authenticated-self
  /api/v1/iam/local-auth/password:
    post:
      tags:
      - IAM / Local authentication
      operationId: changeLocalPassword
      summary: Replace the local password, revoke all existing sessions and issue a replacement session
      security:
      - LocalSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password changed and a replacement session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/PasswordPolicy'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      x-infranexum-idempotency: security-exempt
      x-infranexum-capability: iam.local-auth
      x-infranexum-permission:
        mode: authenticated-self
  /api/v1/iam/local-auth/password-policy/validate:
    post:
      tags:
      - IAM / Local authentication
      operationId: validateLocalPasswordPolicy
      summary: Validate a candidate password without storing it
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - password
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  writeOnly: true
      responses:
        '200':
          description: Policy validation result.
          content:
            application/json:
              schema:
                type: object
                required:
                - valid
                - violations
                properties:
                  valid:
                    type: boolean
                  violations:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
      x-infranexum-idempotency: repeatable
      x-infranexum-capability: iam.local-auth
      x-infranexum-permission:
        mode: anonymous
components:
  securitySchemes:
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: INX_SESSION
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token matching the INX_XSRF browser cookie.
      schema:
        type: string
        minLength: 1
        maxLength: 512
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - accountId
      - username
      - displayName
      - mustChange
      - idleExpiresAt
      - absoluteExpiresAt
      properties:
        sessionId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        mustChange:
          type: boolean
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - message
      - details
      - metadata
      - occurred_at
      - timestamp
      - correlation_id
      - trace_id
      properties:
        type:
          type: string
          description: Stable InfraNexum problem type URI.
        title:
          type: string
          description: Short human-readable problem summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe redacted problem detail.
        instance:
          type: string
          description: Request URI associated with this occurrence.
        code:
          type: string
          description: Stable machine-readable InfraNexum error code.
        message:
          type: string
          deprecated: true
          description: Legacy compatibility alias of detail.
        details:
          type: object
          additionalProperties: true
          description: Structured validation or conflict details.
        metadata:
          type: object
          additionalProperties: true
          description: Reserved non-sensitive problem metadata.
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp of this problem occurrence.
        timestamp:
          type: string
          format: date-time
          deprecated: true
          description: Legacy compatibility alias of occurred_at.
        correlation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Canonical request UUIDv7 correlation identifier.
        trace_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Compatibility trace identifier equal to correlation_id.
      additionalProperties: false
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    AuthenticationFailed:
      description: Generic authentication failure. Account existence is never disclosed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    InvalidSession:
      description: Session is missing, expired, revoked or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    CsrfRejected:
      description: CSRF validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
    PasswordPolicy:
      description: Candidate password violates the authoritative local password policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
  headers:
    CorrelationId:
      description: Canonical UUIDv7 correlation identifier assigned to the request.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
