
server:
  address: ${INFRANEXUM_SERVER_ADDRESS:127.0.0.1}
  port: ${INFRANEXUM_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: infranexum-server
    version: ${INFRANEXUM_VERSION:2.0.0-alpha.0.129}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${INFRANEXUM_DATABASE_URL:}
    username: ${INFRANEXUM_DATABASE_USERNAME:}
    password: ${INFRANEXUM_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${INFRANEXUM_DATABASE_POOL_MAX:10}
      minimum-idle: ${INFRANEXUM_DATABASE_POOL_MIN:1}
      connection-timeout: ${INFRANEXUM_DATABASE_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${INFRANEXUM_DATABASE_VALIDATION_TIMEOUT_MS:5000}
  lifecycle:
    timeout-per-shutdown-phase: 20s

infranexum:
  platform:
    profile: ${INFRANEXUM_PROFILE:LITE}
    allocation-tier: ${INFRANEXUM_ALLOCATION_TIER:STANDARD}
    topology: ${INFRANEXUM_TOPOLOGY:SINGLE_NODE}
    roles: ${INFRANEXUM_ROLES:SERVER,WEB}
    traits: ${INFRANEXUM_TRAITS:}
    installed-capabilities: ${INFRANEXUM_INSTALLED_CAPABILITIES:iam.local-auth,iam.access,platform.bootstrap,platform.entitlements,database.postgresql,discovery.agentless,rsot.core,itam.partners,itam.assets,itam.compliance,dcim.facilities,dcim.physical}
    entitled-capabilities: ${INFRANEXUM_ENTITLED_CAPABILITIES:}
    activation-state: ${INFRANEXUM_ACTIVATION_STATE:NOT_REQUIRED}
    catalog-version: ${INFRANEXUM_CAPABILITY_CATALOG_VERSION:2.0.0-draft.21}
    profile-version: ${INFRANEXUM_PROFILE_VERSION:1}
  persistence:
    mode: ${INFRANEXUM_PERSISTENCE_MODE:POSTGRESQL}
    isolation: ${INFRANEXUM_PERSISTENCE_ISOLATION:READ_COMMITTED}
  scheduling:
    pool-size: ${INFRANEXUM_SCHEDULING_POOL_SIZE:2}
    shutdown-timeout: ${INFRANEXUM_SCHEDULING_SHUTDOWN_TIMEOUT:PT10S}
  integrations:
    enabled: ${INFRANEXUM_INTEGRATIONS_ENABLED:false}
    webhook-max-payload-bytes: ${INFRANEXUM_INTEGRATIONS_WEBHOOK_MAX_PAYLOAD_BYTES:1048576}
    claim-batch-size: ${INFRANEXUM_INTEGRATIONS_CLAIM_BATCH_SIZE:50}
    poll-interval: ${INFRANEXUM_INTEGRATIONS_POLL_INTERVAL:PT1S}
    lease-duration: ${INFRANEXUM_INTEGRATIONS_LEASE_DURATION:PT30S}
    maximum-attempts: ${INFRANEXUM_INTEGRATIONS_MAXIMUM_ATTEMPTS:5}
    initial-retry-delay: ${INFRANEXUM_INTEGRATIONS_INITIAL_RETRY_DELAY:PT1S}
    maximum-retry-delay: ${INFRANEXUM_INTEGRATIONS_MAXIMUM_RETRY_DELAY:PT1M}
    jitter-ratio: ${INFRANEXUM_INTEGRATIONS_JITTER_RATIO:0.2}
    suspend-after-dead-letters: ${INFRANEXUM_INTEGRATIONS_SUSPEND_AFTER_DEAD_LETTERS:3}
    suspension-duration: ${INFRANEXUM_INTEGRATIONS_SUSPENSION_DURATION:PT15M}
    # Empty endpoint/connector/governance maps are intentionally omitted: Spring ConfigData flattens `{}` to an empty scalar,
    # which cannot bind to Map-valued configuration properties. Constructors normalize absent maps to Map.of().
    jira-assets:
      maximum-response-bytes: ${INFRANEXUM_INTEGRATIONS_JIRA_ASSETS_MAX_RESPONSE_BYTES:2097152}
    service-now:
      maximum-response-bytes: ${INFRANEXUM_INTEGRATIONS_SERVICE_NOW_MAX_RESPONSE_BYTES:2097152}
    notifications:
      maximum-payload-bytes: ${INFRANEXUM_INTEGRATIONS_NOTIFICATION_MAX_PAYLOAD_BYTES:1048576}
  workers:
    enabled: ${INFRANEXUM_WORKERS_ENABLED:true}
    concurrency: ${INFRANEXUM_WORKERS_CONCURRENCY:2}
    poll-interval: ${INFRANEXUM_WORKERS_POLL_INTERVAL:PT0.5S}
    lease-duration: ${INFRANEXUM_WORKERS_LEASE_DURATION:PT30S}
    heartbeat-interval: ${INFRANEXUM_WORKERS_HEARTBEAT_INTERVAL:PT10S}
    shutdown-timeout: ${INFRANEXUM_WORKERS_SHUTDOWN_TIMEOUT:PT15S}
    maximum-attempts: ${INFRANEXUM_WORKERS_MAXIMUM_ATTEMPTS:5}
    initial-retry-delay: ${INFRANEXUM_WORKERS_INITIAL_RETRY_DELAY:PT1S}
    maximum-retry-delay: ${INFRANEXUM_WORKERS_MAXIMUM_RETRY_DELAY:PT1M}
    jitter-ratio: ${INFRANEXUM_WORKERS_JITTER_RATIO:0.2}
  entitlements:
    enabled: ${INFRANEXUM_ENTITLEMENTS_ENABLED:true}
    customer-id: ${INFRANEXUM_CUSTOMER_ID:local-evaluation}
    trust-store-path: ${INFRANEXUM_ACTIVATION_TRUST_STORE:}
    integrity-key-path: ${INFRANEXUM_INTEGRITY_KEY_FILE:/run/secrets/infranexum_integrity_key}
    proof-directory: ${INFRANEXUM_INTEGRITY_PROOF_DIRECTORY:/var/lib/infranexum/integrity}
    max-manifest-bytes: ${INFRANEXUM_ACTIVATION_MAX_BYTES:4194304}
    refresh-interval: ${INFRANEXUM_ENTITLEMENT_REFRESH_INTERVAL:PT5M}
  organization:
    api-enabled: ${INFRANEXUM_ORGANIZATION_API_ENABLED:false}
    environment: ${INFRANEXUM_ENVIRONMENT:production}
  itam:
    partner-api-enabled: ${INFRANEXUM_ITAM_PARTNER_API_ENABLED:false}
    asset-api-enabled: ${INFRANEXUM_ITAM_ASSET_API_ENABLED:false}
    compliance-api-enabled: ${INFRANEXUM_ITAM_COMPLIANCE_API_ENABLED:false}
    compliance-alert-interval: ${INFRANEXUM_ITAM_COMPLIANCE_ALERT_INTERVAL:PT1H}
    compliance-alert-thresholds: ${INFRANEXUM_ITAM_COMPLIANCE_ALERT_THRESHOLDS:180,120,90,60,30,15,7,1}
  dcim:
    facility-api-enabled: ${INFRANEXUM_DCIM_FACILITY_API_ENABLED:false}
    physical-api-enabled: ${INFRANEXUM_DCIM_PHYSICAL_API_ENABLED:false}
  identity:
    local:
      enabled: ${INFRANEXUM_LOCAL_AUTH_ENABLED:false}
      environment: ${INFRANEXUM_ENVIRONMENT:production}
      cookie-secure: ${INFRANEXUM_LOCAL_AUTH_COOKIE_SECURE:true}
      bootstrap-username: ${INFRANEXUM_BOOTSTRAP_ADMIN_USERNAME:admin}
      bootstrap-display-name: ${INFRANEXUM_BOOTSTRAP_ADMIN_DISPLAY_NAME:Local Administrator}
      bootstrap-password-file: ${INFRANEXUM_BOOTSTRAP_ADMIN_PASSWORD_FILE:}
      lock-threshold: ${INFRANEXUM_LOCAL_AUTH_LOCK_THRESHOLD:5}
      lock-duration: ${INFRANEXUM_LOCAL_AUTH_LOCK_DURATION:PT15M}
      idle-timeout: ${INFRANEXUM_LOCAL_AUTH_IDLE_TIMEOUT:PT30M}
      absolute-timeout: ${INFRANEXUM_LOCAL_AUTH_ABSOLUTE_TIMEOUT:PT12H}
      touch-interval: ${INFRANEXUM_LOCAL_AUTH_TOUCH_INTERVAL:PT1M}
  server:
    instance-id: ${INFRANEXUM_SERVER_INSTANCE_ID:server-local-1}
    mode: ${INFRANEXUM_SERVER_MODE:STANDALONE}
    region: ${INFRANEXUM_SERVER_REGION:local}
    site: ${INFRANEXUM_SERVER_SITE:local}
    version: ${INFRANEXUM_VERSION:2.0.0-alpha.0.129}
    architecture-baseline: ${INFRANEXUM_ARCHITECTURE_BASELINE:2.0.0-draft.21}

logging:
  structured:
    format:
      console: ecs
    json:
      customizer: io.infranexum.server.observability.SensitiveDataStructuredLoggingCustomizer
      stacktrace:
        max-length: 8192
        max-throwable-depth: 32
        include-common-frames: false
        include-hashes: true
    ecs:
      service:
        version: ${INFRANEXUM_VERSION:2.0.0-alpha.0.129}
        environment: ${INFRANEXUM_ENVIRONMENT:local}
        node-name: ${INFRANEXUM_SERVER_INSTANCE_ID:server-local-1}

management:
  otlp:
    metrics:
      export:
        enabled: ${INFRANEXUM_OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${INFRANEXUM_OTEL_METRICS_EXPORT_URL:http://127.0.0.1:4318/v1/metrics}
  tracing:
    baggage:
      enabled: false
    propagation:
      type: W3C
    sampling:
      probability: ${INFRANEXUM_OTEL_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${INFRANEXUM_OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${INFRANEXUM_OTEL_ENABLED:true}
    map-environment-variables: false
    resource-attributes:
      service.namespace: infranexum
      service.version: ${INFRANEXUM_VERSION:2.0.0-alpha.0.129}
      service.instance.id: ${INFRANEXUM_SERVER_INSTANCE_ID:server-local-1}
      deployment.environment.name: ${INFRANEXUM_ENVIRONMENT:local}
    tracing:
      sampler: parent-based-trace-id-ratio
      limits:
        max-attributes: ${INFRANEXUM_OTEL_MAX_ATTRIBUTES:64}
        max-attribute-value-length: ${INFRANEXUM_OTEL_MAX_ATTRIBUTE_VALUE_LENGTH:256}
        max-events: ${INFRANEXUM_OTEL_MAX_EVENTS:64}
        max-links: ${INFRANEXUM_OTEL_MAX_LINKS:32}
      export:
        max-queue-size: ${INFRANEXUM_OTEL_MAX_QUEUE_SIZE:2048}
        max-batch-size: ${INFRANEXUM_OTEL_MAX_BATCH_SIZE:512}
        schedule-delay: ${INFRANEXUM_OTEL_SCHEDULE_DELAY:5s}
        timeout: ${INFRANEXUM_OTEL_BATCH_TIMEOUT:30s}
        otlp:
          endpoint: ${INFRANEXUM_OTEL_EXPORT_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          transport: http
          compression: gzip
          connect-timeout: ${INFRANEXUM_OTEL_CONNECT_TIMEOUT:5s}
          timeout: ${INFRANEXUM_OTEL_EXPORT_TIMEOUT:10s}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,workers
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
