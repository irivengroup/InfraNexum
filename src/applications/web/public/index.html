<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>InfraNexum — Infrastructure Control &amp; Governance Platform</title>
    <link rel="stylesheet" href="/assets/bootstrap.css" />
    <script type="module" src="/assets/bootstrap.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
      <strong>InfraNexum</strong>
      <span>Infrastructure Control &amp; Governance Platform</span>
    </header>
    <main id="main" tabindex="-1">
      <section class="status-card" aria-labelledby="runtime-title">
        <p class="eyebrow">Web runtime</p>
        <h1 id="runtime-title">Control plane bootstrap</h1>
        <p id="runtime-message" role="status" aria-live="polite">Loading validated public configuration…</p>
        <dl>
          <div><dt>Version</dt><dd id="runtime-version">—</dd></div>
          <div><dt>Environment</dt><dd id="runtime-environment">—</dd></div>
          <div><dt>Server API</dt><dd id="runtime-api">—</dd></div>
        </dl>
      </section>
    </main>
    <noscript>JavaScript is required to initialize the InfraNexum Web interface.</noscript>
  </body>
</html>
