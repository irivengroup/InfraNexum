name: Foundation quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned validation tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements/ci.txt
      - name: Run architecture, toolchain, migration and contract gates
        run: make architecture-test architecture-check toolchain-test toolchain-check migration-test migration-check eventing-test eventing-check persistence-test persistence-check capabilities-test capabilities-check entitlements-test entitlements-check java-contract-smoke java-eventing-smoke java-jdbc-smoke java-capabilities-smoke java-entitlements-smoke

  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: src/applications/agent/go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Vet, test with race detection, enforce coverage and build Agent
        run: make agent-vet agent-test agent-build

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
          cache: pnpm
          cache-dependency-path: src/applications/web/pnpm-lock.yaml
      - name: Enable exact pnpm toolchain
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Verify empty dependency graph and immutable lockfile
        working-directory: src/applications/web
        run: pnpm install --frozen-lockfile --offline
      - name: Test and smoke Web runtime
        run: make web-verify

  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'
          cache: maven
      - name: Verify Java modules and executable Server package
        run: ./mvnw --batch-mode --no-transfer-progress verify


  postgresql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: infranexum
          POSTGRES_USER: infranexum
          POSTGRES_PASSWORD: infranexum-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infranexum -d infranexum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7'
          cache: maven
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Apply paired PostgreSQL migrations
        env:
          PGPASSWORD: infranexum-ci
        run: |
          psql --host 127.0.0.1 --username infranexum --dbname infranexum --set ON_ERROR_STOP=1 --file src/distribution/migrations/0001-core-schema-history/postgresql.sql
          psql --host 127.0.0.1 --username infranexum --dbname infranexum --set ON_ERROR_STOP=1 --file src/distribution/migrations/0002-core-transactional-events/postgresql.sql
          psql --host 127.0.0.1 --username infranexum --dbname infranexum --set ON_ERROR_STOP=1 --file src/distribution/migrations/0003-core-inbox-reservation/postgresql.sql
          psql --host 127.0.0.1 --username infranexum --dbname infranexum --set ON_ERROR_STOP=1 --file src/distribution/migrations/0004-core-entitlements/postgresql.sql
      - name: Run live JDBC transaction and concurrency contracts
        env:
          INFRANEXUM_POSTGRESQL_TEST_URL: jdbc:postgresql://127.0.0.1:5432/infranexum
          INFRANEXUM_POSTGRESQL_TEST_USERNAME: infranexum
          INFRANEXUM_POSTGRESQL_TEST_PASSWORD: infranexum-ci
        run: ./mvnw --batch-mode --no-transfer-progress -pl src/components/adapters/persistence-jdbc -am -Dtest=PostgreSqlJdbcTransactionalEventStoreTest -Dsurefire.failIfNoSpecifiedTests=false test
