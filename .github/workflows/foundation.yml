name: Foundation quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned validation tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements/ci.txt
      - name: Verify canonical source inventory and Git tracking
        run: SOURCE_INTEGRITY_REQUIRE_GIT=1 SOURCE_INTEGRITY_REQUIRE_STAGED=1 SOURCE_INTEGRITY_REQUIRE_CHECKSUMS=1 make source-integrity-test source-integrity-check

  connector-sdk:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned connector SDK validation tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements/ci.txt
      - name: Test, certify and package connector SDK
        run: make sdk-test sdk-check


  archive-compatibility:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned validation tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements/ci.txt
      - name: Validate published ZIP portability for Windows extraction
        run: make archive-compatibility-test archive-compatibility-check

  architecture:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - name: Install pinned validation tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements/ci.txt
      - name: Run architecture, toolchain, migration and contract gates
        run: make api-contract-test api-contract-check architecture-test architecture-check toolchain-test toolchain-check migration-test migration-check eventing-test eventing-check persistence-test persistence-check capabilities-test capabilities-check entitlements-test entitlements-check audit-test audit-check java-contract-smoke java-eventing-smoke java-audit-smoke java-jdbc-smoke java-capabilities-smoke java-api-capability-smoke java-entitlements-smoke java-entitlement-runtime-smoke java-activation-operations-smoke java-workers-smoke java-jdbc-workers-smoke java-integrations-smoke

  agent:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: src/applications/agent/go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Vet, test with race detection, enforce coverage and build Agent
        run: make agent-vet agent-test agent-build

  web:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: '11.17.0'
          runtime: node@24.18.1
          cache: true
          cache-dependency-path: src/applications/web/pnpm-lock.yaml
          install: false
      - name: Verify exact Web toolchains
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.17.0"
      - name: Verify empty dependency graph and immutable lockfile
        working-directory: src/applications/web
        run: pnpm install --frozen-lockfile --offline
      - name: Test and smoke Web runtime
        run: make web-verify

  java:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: infranexum
          POSTGRES_USER: infranexum
          POSTGRES_PASSWORD: infranexum-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infranexum -d infranexum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: infranexum
      PGUSER: infranexum
      PGPASSWORD: infranexum-ci
      INFRANEXUM_POSTGRESQL_TEST_URL: jdbc:postgresql://127.0.0.1:5432/infranexum
      INFRANEXUM_POSTGRESQL_TEST_USERNAME: infranexum
      INFRANEXUM_POSTGRESQL_TEST_PASSWORD: infranexum-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven
      - name: Prepare Maven Wrapper
        run: chmod 0755 mvnw && test -x mvnw
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Apply PostgreSQL test schema
        run: make postgresql-test-schema
      - name: Verify Java modules and executable Server package
        run: ./mvnw --batch-mode --no-transfer-progress --fail-at-end verify
      - name: Report JaCoCo gaps on failure
        if: failure()
        run: python3 tools/jacoco_gaps.py


  java-module-coverage:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: infranexum
          POSTGRES_USER: infranexum
          POSTGRES_PASSWORD: infranexum-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infranexum -d infranexum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: infranexum
      PGUSER: infranexum
      PGPASSWORD: infranexum-ci
      INFRANEXUM_POSTGRESQL_TEST_URL: jdbc:postgresql://127.0.0.1:5432/infranexum
      INFRANEXUM_POSTGRESQL_TEST_USERNAME: infranexum
      INFRANEXUM_POSTGRESQL_TEST_PASSWORD: infranexum-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven
      - name: Prepare Maven Wrapper
        run: chmod 0755 mvnw && test -x mvnw
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Apply PostgreSQL test schema
        run: make postgresql-test-schema
      - name: Verify every Java module independently
        run: make java-module-verify
      - name: Report JaCoCo gaps on failure
        if: failure()
        run: python3 tools/jacoco_gaps.py


  postgresql-integration:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: infranexum
          POSTGRES_USER: infranexum
          POSTGRES_PASSWORD: infranexum-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infranexum -d infranexum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven
      - name: Prepare Maven Wrapper
        run: chmod 0755 mvnw && test -x mvnw
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Apply paired PostgreSQL migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: infranexum
          PGUSER: infranexum
          PGPASSWORD: infranexum-ci
        run: make postgresql-test-schema
      - name: Run live JDBC transaction and concurrency contracts
        env:
          INFRANEXUM_POSTGRESQL_TEST_URL: jdbc:postgresql://127.0.0.1:5432/infranexum
          INFRANEXUM_POSTGRESQL_TEST_USERNAME: infranexum
          INFRANEXUM_POSTGRESQL_TEST_PASSWORD: infranexum-ci
        run: ./mvnw --batch-mode --no-transfer-progress -pl src/components/adapters/jdbc -am -Dtest=PostgreSqlJdbcTransactionalEventStoreTest,PostgreSqlJdbcAuditJournalTest,PostgreSqlJdbcTaskStoreTest,PostgreSqlJdbcEntitlementPersistenceTest,PostgreSqlJdbcConnectorInboxRepositoryTest,PostgreSqlJdbcConnectorSyncRepositoryTest -Dinfranexum.surefire.failIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false test
